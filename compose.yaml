services:
  play-local:
    image: cube-play-dev:local
    build:
      context: .
      additional_contexts:
        cube_engine: "${CUBE_PLAY_CORE_SOURCE:-../cube}"
      args:
        CUBE_PLAY_UID: "${CUBE_PLAY_UID:-65532}"
        CUBE_PLAY_GID: "${CUBE_PLAY_GID:-65532}"
    ports:
      - "127.0.0.1:${CUBE_PLAY_PORT:-7331}:7331"
    environment:
      CUBE_PLAY_ORIGIN: "http://127.0.0.1:${CUBE_PLAY_PORT:-7331}"
      CUBE_PLAY_RUNNER_SOCKET: /run/cube-play/terminal/runner.sock
    depends_on:
      cube-runner:
        condition: service_healthy
    read_only: true
    volumes:
      - play-data:/var/lib/cube-play
      - play-artifacts:/var/lib/cube-play/artifacts
      - play-terminal:/run/cube-play/terminal:ro
    user: "${CUBE_PLAY_UID:-65532}:${CUBE_PLAY_GID:-65532}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 10s
  cube-runner:
    image: cube-play-dev:local
    build:
      context: .
      additional_contexts:
        cube_engine: "${CUBE_PLAY_CORE_SOURCE:-../cube}"
      args:
        CUBE_PLAY_UID: "${CUBE_PLAY_UID:-65532}"
        CUBE_PLAY_GID: "${CUBE_PLAY_GID:-65532}"
    entrypoint: [/usr/local/bin/cube-runner]
    network_mode: none
    read_only: true
    volumes:
      - play-data:/workspace/data:ro
      - play-artifacts:/workspace/output
      - play-terminal:/run/cube-play/terminal
    user: "${CUBE_PLAY_UID:-65532}:${CUBE_PLAY_GID:-65532}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 10s
    healthcheck:
      test: [CMD, /usr/local/bin/cube-runner, --healthcheck]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6

volumes:
  play-data:
  play-artifacts:
  play-terminal:
