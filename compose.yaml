services:
  play-local:
    build:
      context: .
      args:
        CUBE_PLAY_UID: "${CUBE_PLAY_UID:-65532}"
        CUBE_PLAY_GID: "${CUBE_PLAY_GID:-65532}"
    ports:
      - "127.0.0.1:${CUBE_PLAY_PORT:-7331}:7331"
    environment:
      CUBE_PLAY_ORIGIN: "http://127.0.0.1:${CUBE_PLAY_PORT:-7331}"
    read_only: true
    user: "${CUBE_PLAY_UID:-65532}:${CUBE_PLAY_GID:-65532}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 10s
