name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-boundary:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: play
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: play
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cubearc/cube
          ref: 447b749d7aa51ba761e1957e8e780f543513fd69
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: play -> target
          key: windows-boundary-qualification
          cache-on-failure: true
      - run: cargo build -p play-engine --example windows-boundary-probe --example native-supervision-probe --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p play-engine --test windows_native --locked -- --nocapture
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - id: typescript
        run: npx --prefix frontend tsc -p frontend/tsconfig.desktop.json
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path frontend/desktop-native -Force
          Copy-Item target/debug/play-engine.exe frontend/desktop-native/play-engine.exe
          Copy-Item target/debug/examples/native-supervision-probe.exe frontend/desktop-native/native-supervision-probe.exe
      - run: node --test --test-concurrency=1 frontend/desktop-dist/registry.test.js
      - name: Common native Workspace and Run lifecycle scenarios
        if: ${{ !cancelled() && steps.typescript.outcome == 'success' }}
        run: node --test --test-concurrency=1 frontend/desktop-dist/workspace.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-operation-conformance
          path: play/frontend/playwright-report/native-operation-conformance.json
          if-no-files-found: warn
