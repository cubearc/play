name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: play

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: bbb2fda93407146b446c4717e31e7c6fded87194
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - run: cargo test --workspace --all-features --locked
        env:
          RUST_TEST_THREADS: "1"

  rust-quality:
    name: Rust quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: bbb2fda93407146b446c4717e31e7c6fded87194
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo fmt --all -- --check
      - run: rustfmt --check --edition 2024 crates/play-launcher/tests/support/docker_fixture.rs crates/play-launcher/tests/support/folder_picker.rs crates/play-runner/tests/support/resource_probe.rs
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80 --ignore-filename-regex '/tests/'
      - run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '/tests/'
      - name: Preserve exact typed API conformance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-operation-conformance
          path: play/target/play-operation-conformance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: play/lcov.info
          if-no-files-found: error

  frontend:
    name: Frontend and real browser smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: play/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: bbb2fda93407146b446c4717e31e7c6fded87194
          path: cube
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:coverage
      - run: cargo build --locked --manifest-path ../Cargo.toml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: play/frontend/coverage/lcov.info
          if-no-files-found: error

  docker:
    name: Docker build and runtime smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: bbb2fda93407146b446c4717e31e7c6fded87194
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cargo build --locked -p play-launcher
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: docker build --target runner-tests --build-context cube_engine=../cube .
      - run: docker build --target lab-tests --build-context cube_engine=../cube .
      - run: python3 tests/runtime_smoke.py
        env:
          CUBE_PLAY_CUBE: ${{ github.workspace }}/cube/target/debug/cube
          CUBE_PLAY_LAUNCHER: ${{ github.workspace }}/play/target/debug/cube-play

  native-desktop:
    name: Electron native proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: bbb2fda93407146b446c4717e31e7c6fded87194
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run desktop:build --prefix frontend
      - run: npm run desktop:test --prefix frontend
      - run: npm run desktop:smoke --prefix frontend
      - name: Preserve native conformance and Electron screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-proof-${{ matrix.os }}
          path: |
            play/frontend/playwright-report/native-*.png
            play/frontend/playwright-report/native-operation-conformance.json
          if-no-files-found: error
