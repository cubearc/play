name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: play

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: e727a4536233720e081bdb1dfb3efb6eeb8d45a8
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - run: cargo test --workspace --all-features --locked
        env:
          RUST_TEST_THREADS: "1"

  rust-quality:
    name: Rust quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: e727a4536233720e081bdb1dfb3efb6eeb8d45a8
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80 --ignore-filename-regex '/tests/'
      - run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '/tests/'
      - run: cargo test --locked --manifest-path ../cube/Cargo.toml -p cube-core --test conformance_matrix --test operation_contracts --test execution_registry
      - name: Preserve exact Core conformance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-operation-conformance
          path: cube/target/core-operation-conformance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: play/lcov.info
          if-no-files-found: error

  frontend:
    name: Native frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: play/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: python3 ../tests/architecture_test.py

  native-desktop:
    name: Electron native proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    # Cold Intel builds plus the complete Electron suite exceed 20 minutes.
    # Product worker budgets and individual test deadlines remain unchanged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: e727a4536233720e081bdb1dfb3efb6eeb8d45a8
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run desktop:build --prefix frontend
      - run: npm run desktop:test --prefix frontend
      - run: npm run desktop:smoke --prefix frontend
        if: matrix.os != 'macos-26'
      - run: npm run test:coverage --prefix frontend
        if: matrix.os == 'macos-26'
      - name: Build and exercise the standalone preview bundle
        run: |
          npm run desktop:package --prefix frontend
          cp "frontend/desktop-packages/Cube Play-darwin-$(node -p process.arch)/Cube Play.app/Contents/Resources/app/package-proof.json" frontend/playwright-report/native-package-proof.json
          PLAY_PACKAGED_EXECUTABLE="$PWD/frontend/desktop-packages/Cube Play-darwin-$(node -p process.arch)/Cube Play.app/Contents/MacOS/cube-play" npm run desktop:smoke --prefix frontend
      - name: Preserve native conformance and Electron screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-proof-${{ matrix.os }}
          path: |
            play/frontend/playwright-report/*.png
            play/frontend/playwright-report/native-operation-conformance.json
            play/frontend/playwright-report/native-package-proof.json
            play/frontend/coverage/lcov.info
            play/frontend/coverage/coverage-summary.json
          if-no-files-found: error

  native-linux:
    name: Linux native worker and Electron proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: e727a4536233720e081bdb1dfb3efb6eeb8d45a8
          persist-credentials: false
          path: cube
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: cargo clippy -p play-engine --all-targets --locked -- -D warnings
      - run: npm run desktop:build --prefix frontend
      - name: Install display dependencies and Chromium sandbox helper
        run: |
          cd frontend
          npx playwright install-deps chromium
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run desktop:test --prefix frontend
      - run: xvfb-run -a npm run desktop:smoke --prefix frontend
      - name: Build and exercise the standalone preview bundle
        run: |
          npm run desktop:package --prefix frontend
          package="$PWD/frontend/desktop-packages/cube-play-linux-$(node -p process.arch)"
          sudo chown root:root "$package/chrome-sandbox"
          sudo chmod 4755 "$package/chrome-sandbox"
          cp "$package/resources/app/package-proof.json" frontend/playwright-report/native-package-proof.json
          DEBUG=pw:browser PLAY_PACKAGED_EXECUTABLE="$package/cube-play" xvfb-run -a npm run desktop:smoke --prefix frontend
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-proof-${{ matrix.os }}
          path: |
            play/frontend/playwright-report/native-operation-conformance.json
            play/frontend/playwright-report/*.png
            play/frontend/playwright-report/native-package-proof.json
          if-no-files-found: error
