name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-boundary-red:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: play
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: play
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cubearc/cube
          ref: 447b749d7aa51ba761e1957e8e780f543513fd69
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: cargo test -p play-engine --test windows_native --locked -- --nocapture
