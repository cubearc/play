name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: play

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: 447b749d7aa51ba761e1957e8e780f543513fd69
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - name: Build actual Windows boundary fixtures
        if: runner.os == 'Windows'
        run: cargo build -p play-engine --example windows-boundary-probe --locked
      - run: cargo test --workspace --all-features --locked
        env:
          RUST_TEST_THREADS: "1"

  rust-quality:
    name: Rust quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: 447b749d7aa51ba761e1957e8e780f543513fd69
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80 --ignore-filename-regex '/tests/'
      - run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '/tests/'
      - run: cargo test --locked --manifest-path ../cube/Cargo.toml -p cube-core --test conformance_matrix --test operation_contracts --test execution_registry
      - name: Preserve exact Core conformance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-operation-conformance
          path: cube/target/core-operation-conformance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: play/lcov.info
          if-no-files-found: error

  frontend:
    name: Native frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: play/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1
      - run: python3 ../tests/architecture_test.py

  native-desktop:
    name: Electron native proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    # Measured Intel cold build: 14m20s; source and packaged journeys: about 10m each.
    # Keep enough job time for both proofs; worker and test deadlines are unchanged.
    timeout-minutes: 45
    # Match the compact profile used by Core CI and the local native proof.
    # Rust debug assertions and every runtime/test deadline remain enabled.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - name: Check out the public versioned Core library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: 447b749d7aa51ba761e1957e8e780f543513fd69
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Keep cold dependency compilation out of repeated native proofs.
      # Source, packaged journeys and all existing deadlines still run in full.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: play -> target
          key: native-compact
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run desktop:build --prefix frontend
      - run: npm run desktop:test --prefix frontend
      - run: npm run desktop:smoke --prefix frontend
        if: matrix.os != 'macos-26'
      - run: npm run test:coverage --prefix frontend
        if: matrix.os == 'macos-26'
      - name: Build and exercise the standalone preview bundle
        run: |
          npm run desktop:package --prefix frontend
          npm run desktop:delivery-test --prefix frontend
          cp "frontend/desktop-packages/Cube-Play-$(node -p 'require("./frontend/package.json").version')-darwin-$(node -p process.arch).dmg.proof.json" frontend/playwright-report/native-installer-proof.json
          cp "frontend/desktop-packages/Cube Play-darwin-$(node -p process.arch)/Cube Play.app/Contents/Resources/app/package-proof.json" frontend/playwright-report/native-package-proof.json
          PLAY_PACKAGED_EXECUTABLE="$PWD/frontend/desktop-packages/Cube Play-darwin-$(node -p process.arch)/Cube Play.app/Contents/MacOS/cube-play" npm run desktop:smoke --prefix frontend
      - name: Preserve native conformance and Electron screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-desktop-proof-${{ matrix.os }}
          path: |
            play/frontend/playwright-report/*.png
            play/frontend/playwright-report/native-operation-conformance.json
            play/frontend/playwright-report/native-package-proof.json
            play/frontend/playwright-report/native-installer-proof.json
            play/frontend/coverage/lcov.info
            play/frontend/coverage/coverage-summary.json
          if-no-files-found: error

  native-linux:
    name: Linux native worker and Electron proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Observed full proof: 20m04s including cleanup; all test steps passed.
    # Allow cold-build/catalog growth without changing worker or test deadlines.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: play
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: cubearc/cube
          ref: 447b749d7aa51ba761e1957e8e780f543513fd69
          persist-credentials: false
          path: cube
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: cargo clippy -p play-engine --all-targets --locked -- -D warnings
      - run: npm run desktop:build --prefix frontend
      - name: Install display dependencies and Chromium sandbox helper
        run: |
          cd frontend
          npx playwright install-deps chromium
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run desktop:test --prefix frontend
      - run: xvfb-run -a npm run desktop:smoke --prefix frontend
      - name: Build and exercise the standalone preview bundle
        run: |
          npm run desktop:package --prefix frontend
          package="$PWD/frontend/desktop-packages/cube-play-linux-$(node -p process.arch)"
          sudo chown root:root "$package/chrome-sandbox"
          sudo chmod 4755 "$package/chrome-sandbox"
          cp "$package/resources/app/package-proof.json" frontend/playwright-report/native-package-proof.json
          DEBUG=pw:browser PLAY_PACKAGED_EXECUTABLE="$package/cube-play" xvfb-run -a npm run desktop:smoke --prefix frontend
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-proof-${{ matrix.os }}
          path: |
            play/frontend/playwright-report/native-operation-conformance.json
            play/frontend/playwright-report/*.png
            play/frontend/playwright-report/native-package-proof.json
          if-no-files-found: error

  windows-engine:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: play
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: play
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cubearc/cube
          ref: 447b749d7aa51ba761e1957e8e780f543513fd69
          path: cube
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: play -> target
          key: windows-boundary-qualification
          cache-on-failure: true
      - run: cargo build -p play-engine --example windows-boundary-probe --example native-supervision-probe --locked
      - run: cargo build -p play-windows-boundary --example owned-processes --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p play-engine --test windows_native --locked -- --nocapture
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: play/frontend/.nvmrc
          cache: npm
          cache-dependency-path: play/frontend/package-lock.json
      - run: npm ci --prefix frontend
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - id: typescript
        run: npx --prefix frontend tsc -p frontend/tsconfig.desktop.json
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path frontend/desktop-native -Force
          Copy-Item target/debug/play-engine.exe frontend/desktop-native/play-engine.exe
          Copy-Item target/debug/examples/native-supervision-probe.exe frontend/desktop-native/native-supervision-probe.exe
          Copy-Item target/debug/examples/owned-processes.exe frontend/desktop-native/owned-processes.exe
      - working-directory: play/frontend
        run: node --test --test-concurrency=1 desktop-dist/registry.test.js
      - name: Common native Workspace and Run lifecycle scenarios
        if: ${{ !cancelled() && steps.typescript.outcome == 'success' }}
        working-directory: play/frontend
        run: node --test --test-concurrency=1 desktop-dist/workspace.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-operation-conformance
          path: play/frontend/playwright-report/native-operation-conformance.json
          if-no-files-found: warn
