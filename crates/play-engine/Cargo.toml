[package]
name = "play-engine"
description = "Private native desktop engine boundary proof"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cube-core = { path = "../../../cube/crates/cube-core", version = "=0.18.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "pty", "termios", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[target.'cfg(target_os = "linux")'.dependencies]
cube-cli = { path = "../../../cube/crates/cube-cli", version = "=0.18.0" }
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "0.2"

[lints]
workspace = true
