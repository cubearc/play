[package]
name = "play-launcher"
description = "Trusted host-side launcher for Cube Play local workspaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cube-play"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
directories = "6.0.0"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1.0.6"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
webbrowser = "1.2.5"

[lints]
workspace = true
